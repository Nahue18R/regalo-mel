<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2a1f4a">
  <meta name="description" content="Un regalo para la po 💛">
  <title>Para la po 💛</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%9B%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <!-- Escenario 16:9: el canvas dibuja todo el juego, la UI va encima en HTML -->
    <div id="stage" class="stage">
      <canvas id="game" width="1024" height="576" role="img"
              aria-label="Escena pixel art: Mel espera frente a la droguería Del Sud en Carlos Gardel 3546, Avellaneda."></canvas>

      <div class="ui" id="ui">
        <button id="musicBtn" class="music-btn" type="button" aria-label="Reproducir música" aria-expanded="false" aria-controls="musicPanel">
          <span class="music-icon" aria-hidden="true">▶</span>
        </button>
        <button id="muteBtn" class="icon-btn" type="button" aria-label="Silenciar sonido" aria-pressed="false">🔊</button>

        <div id="bigHeart" class="big-heart" aria-hidden="true">💛</div>

        <div class="bottom">
          <p id="hint" class="hint">Toca la pantalla</p>
          <button id="actionBtn" class="btn btn-primary" type="button">Comenzar</button>
          <div id="finalBtns" class="final-btns" hidden>
            <button id="rereadBtn" class="btn btn-ghost" type="button">Leer la carta 💌</button>
            <button id="restartBtn" class="btn btn-ghost" type="button">Reiniciar ↺</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Reproductor de música (se carga recién al tocar ▶) -->
    <aside id="musicPanel" class="music-panel" hidden aria-label="Reproductor de música">
      <div class="music-head">
        <span>♪ Música</span>
        <button id="musicClose" class="music-close" type="button" aria-label="Cerrar y detener la música">✕</button>
      </div>
      <div id="musicFrame" class="music-frame"></div>
      <a class="music-link" href="https://www.youtube.com/watch?v=mlrozstOdSI" target="_blank" rel="noopener">¿No suena? Abrir en YouTube ↗</a>
    </aside>

    <p class="rotate-hint">Girá el celu 📱 para verlo en grande</p>

    <!-- Texto accesible para lectores de pantalla (el contenido visual vive en el canvas) -->
    <div id="srLive" class="sr-only" aria-live="polite"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
